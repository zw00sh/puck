---
# --- Free host :53 from systemd-resolved's stub listener (if present) -----------
# Pi-hole on host networking needs 0.0.0.0:53. If systemd-resolved is running its
# stub on 127.0.0.53:53, that overlaps and the container fails to bind. Disable the
# stub and repoint resolv.conf at resolved's upstream file so HOST name resolution
# keeps working independently of Pi-hole (no chicken-and-egg on the container).
- name: Check whether systemd-resolved is active (it would hold :53)
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: pihole_resolved
  changed_when: false
  failed_when: false

- name: Ensure the resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  when: pihole_resolved.stdout == "active"

- name: Disable the systemd-resolved DNS stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/10-pihole-no-stub.conf
    mode: "0644"
    content: |
      [Resolve]
      DNSStubListener=no
  when: pihole_resolved.stdout == "active"
  notify: Restart systemd-resolved

- name: Point host resolv.conf at resolved's upstream file (not the disabled stub)
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: pihole_resolved.stdout == "active"

# Apply the resolved change BEFORE the container tries to bind :53.
- name: Flush handlers so :53 is free before Pi-hole starts
  ansible.builtin.meta: flush_handlers

# --- Bring up Pi-hole ----------------------------------------------------------
- name: Create the Pi-hole config directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}/etc-pihole"
    state: directory
    mode: "0755"

- name: Template the Pi-hole compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pihole_dir }}/docker-compose.yml"
    mode: "0644"

- name: Bring up Pi-hole
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_dir }}"
    state: present
    pull: missing

# --- Keep BIND working across reboots ------------------------------------------
# listeningMode is BIND (dnsmasq bind-interfaces): :53 is bound to the LAN NIC's
# *address*, evaluated once when FTL starts. We keep BIND (not SINGLE/bind-dynamic)
# on purpose — this puck can be a subnet router, so tailnet clients reach Pi-hole
# at the LAN IP via the advertised route: their queries arrive on tailscale0 but
# are destined for eth0's address, and only bind-interfaces answers those
# (bind-dynamic filters by *arrival* interface and would drop them).
#
# The cost of BIND is a startup race: if eth0 has no IPv4 yet when FTL starts
# (NetworkManager reaches network-online.target before the DHCP lease lands),
# dnsmasq logs `unknown interface eth0`, falls back to loopback, and never
# rebinds — DNS is dead until something restarts the container. Two guards:
#   1. Prevent — hold Docker (and thus container autostart) until eth0 has IPv4.
#   2. Cure    — a timer that restarts the container if it ever goes unhealthy.

- name: Install the eth0-ready gate (Pi-hole BIND needs the LAN NIC's IPv4 at start)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/pihole-wait-{{ pihole_dns_interface }}.service"
    mode: "0644"
    content: |
      # Managed by Ansible. Blocks until {{ pihole_dns_interface }} has an IPv4
      # address so Pi-hole's bind-interfaces (BIND) binds the LAN NIC first try.
      # Fails open after 60s — the healthcheck timer is the backstop.
      [Unit]
      Description=Wait for {{ pihole_dns_interface }} IPv4 (Pi-hole BIND)
      After=network-online.target
      Wants=network-online.target
      Before=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/sh -c 'for i in $(seq 1 60); do ip -4 addr show {{ pihole_dns_interface }} | grep -q "inet " && exit 0; sleep 1; done; exit 0'

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd daemon

- name: Ensure the docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Order Docker after the eth0-ready gate
  ansible.builtin.copy:
    dest: "/etc/systemd/system/docker.service.d/10-pihole-wait-{{ pihole_dns_interface }}.conf"
    mode: "0644"
    content: |
      # Managed by Ansible. Hold container autostart until {{ pihole_dns_interface }}
      # has its IPv4 address (see pihole-wait-{{ pihole_dns_interface }}.service).
      [Unit]
      After=pihole-wait-{{ pihole_dns_interface }}.service
      Wants=pihole-wait-{{ pihole_dns_interface }}.service
  notify: Reload systemd daemon

- name: Install the Pi-hole DNS healthcheck script
  ansible.builtin.copy:
    src: pihole-healthcheck.sh
    dest: /usr/local/sbin/pihole-healthcheck.sh
    mode: "0755"

- name: Install the Pi-hole healthcheck service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pihole-healthcheck.service
    mode: "0644"
    content: |
      # Managed by Ansible. Restarts Pi-hole if Docker marks it unhealthy.
      [Unit]
      Description=Restart Pi-hole if its DNS healthcheck is failing
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/pihole-healthcheck.sh
  notify: Reload systemd daemon

- name: Install the Pi-hole healthcheck timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/pihole-healthcheck.timer
    mode: "0644"
    content: |
      # Managed by Ansible. Checks Pi-hole health shortly after boot, then hourly-ish.
      [Unit]
      Description=Periodically restart Pi-hole if it is unhealthy

      [Timer]
      OnBootSec=90s
      OnUnitActiveSec=60s

      [Install]
      WantedBy=timers.target
  notify: Reload systemd daemon

- name: Enable the eth0-ready gate and the healthcheck timer
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ item.state }}"
    daemon_reload: true
  loop:
    - { name: "pihole-wait-{{ pihole_dns_interface }}.service", state: "started" }
    - { name: "pihole-healthcheck.timer", state: "started" }

- name: Note when no admin password was pinned
  ansible.builtin.debug:
    msg: >-
      No pihole_admin_password set — Pi-hole generated a random admin password.
      Read it with `docker logs pihole | grep -i password`, or set
      pihole_admin_password (secrets.yml / -e) to pin one.
  when: not (pihole_admin_password | length > 0)

# --- Expose the admin UI on the tailnet over HTTP (separate serve port) ---------
- name: Read Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: pihole_ts_status
  changed_when: false
  failed_when: false

- name: Note whether the node is on the tailnet
  ansible.builtin.set_fact:
    pihole_ts_running: "{{ (pihole_ts_status.stdout | default('{}') | from_json).BackendState | default('') == 'Running' }}"

- name: Read current tailscale serve config
  ansible.builtin.command: tailscale serve status
  register: pihole_ts_serve
  changed_when: false
  failed_when: false
  when: pihole_ts_running

- name: Expose the Pi-hole admin UI on the tailnet over HTTP
  ansible.builtin.command: "tailscale serve --bg --http={{ pihole_serve_port }} {{ pihole_web_port }}"
  when:
    - pihole_ts_running
    - (pihole_web_bind ~ ':' ~ pihole_web_port) not in (pihole_ts_serve.stdout | default(''))
  changed_when: true

- name: Report when Tailscale serve was skipped
  ansible.builtin.debug:
    msg: >-
      Node not on the tailnet — Pi-hole is up on {{ pihole_web_bind }}:{{ pihole_web_port }}
      but skipped `tailscale serve`. Enroll the node (supply ts_authkey) and re-run.
      DNS still answers on :53 regardless. The admin UI will be at
      http://{{ inventory_hostname }}:{{ pihole_serve_port }}/admin once served.
  when: not pihole_ts_running
